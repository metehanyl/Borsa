name: Build APK

on:
  push:
    branches:
      - "claude/**"
      - "main"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 internally runs `sdkmanager tools`,
      # which fails now that Google has removed the legacy "tools" package
      # from the SDK repository. Bypass it entirely by installing the
      # command line tools ourselves — a well-known, dependency-free pattern.
      - name: Set up Android SDK (cmdline-tools)
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sS -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APKs for clarity
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/KureselBorsa-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/KureselBorsa-release.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuresel-borsa-apk
          path: dist/*.apk
          retention-days: 90

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "Küresel Borsa APK - build #${{ github.run_number }}"
          body: |
            Bu APK, ${{ github.sha }} commit'inden otomatik olarak GitHub Actions ile derlendi.
            "KureselBorsa-release.apk" dosyasını telefonunuza indirip kurabilirsiniz
            (Ayarlar > Güvenlik > Bilinmeyen kaynaklardan yükleme izni gerekir).
          files: dist/*.apk
          draft: false
          prerelease: false
